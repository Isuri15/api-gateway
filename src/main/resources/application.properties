spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888

# Enable Eureka based service discovery for Gateway routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route: Owner Service
spring.cloud.gateway.routes[0].id=owner-service
spring.cloud.gateway.routes[0].uri=lb://owner-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/owners/**

# Route: Pet Service
spring.cloud.gateway.routes[1].id=pet-service
spring.cloud.gateway.routes[1].uri=lb://pet-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/pets/**

# Route: Appointment Service
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://appointment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

management.endpoints.web.exposure.include=*